<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>附近精灵</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #111c33; --line: #1e293b; --text: #e2e8f0;
      --muted: #94a3b8; --row: #111c33; --alert-bg: #2a1220; --alert-line: #be123c;
      --rare-line: #b45309; --ok: #34d399; --tag: #f87171;
    }
    body[data-theme="light"] {
      --bg: #ffffff; --panel: #f8fafc; --line: #e2e8f0; --text: #0f172a;
      --muted: #64748b; --row: #f8fafc; --alert-bg: #fef2f2; --alert-line: #fecdd3;
      --rare-line: #fcd34d; --ok: #059669; --tag: #be123c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 12px/1.35 "Microsoft YaHei UI", "Segoe UI", sans-serif;
      user-select: none; overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--line);
      -webkit-app-region: drag; flex: 0 0 auto;
    }
    header .status { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .status b { color: var(--ok); font-weight: 600; }
    header .actions { display: flex; gap: 4px; -webkit-app-region: no-drag; flex: 0 0 auto; }
    header button {
      border: 1px solid var(--line); background: var(--row); color: var(--muted);
      border-radius: 6px; font-size: 11px; padding: 2px 6px; cursor: pointer; white-space: nowrap;
    }
    header button[aria-pressed="true"] { background: #f59e0b; border-color: #f59e0b; color: #1f2937; font-weight: 600; }
    main { flex: 1; display: flex; gap: 8px; padding: 8px; min-height: 0; }
    .map-wrap { position: relative; width: 240px; height: 240px; flex: 0 0 auto; border-radius: 10px; overflow: hidden; background: var(--line); }
    .map-wrap canvas { display: block; width: 100%; height: 100%; }
    .map-wrap .hint { position: absolute; left: 5px; bottom: 4px; font-size: 9px; color: #cbd5e1; text-shadow: 0 1px 2px #000; }
    body[data-theme="light"] .map-wrap .hint { color: #475569; text-shadow: 0 1px 2px #fff; }
    ul { flex: 1; min-width: 0; margin: 0; padding: 0; list-style: none; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    li { display: flex; align-items: baseline; gap: 4px; background: var(--row); border: 1px solid var(--line); border-radius: 7px; padding: 3px 5px; min-height: 22px; }
    li.alert { border-color: var(--alert-line); background: var(--alert-bg); }
    li.rare { border-color: var(--rare-line); }
    li .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
    li .name { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .meta { margin-left: auto; font-size: 10px; color: var(--muted); white-space: nowrap; }
    li .tag { font-size: 9px; color: var(--tag); white-space: nowrap; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 8px; }
    .empty[hidden] { display: none; }
    footer { padding: 1px 8px 4px; font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; flex: 0 0 auto; }
    /* 收起态：只留标题条 */
    body.collapsed main, body.collapsed footer { display: none; }
    body.collapsed header { border-bottom: 0; height: 100%; }
    #expand { display: none; }
    body.collapsed #collapse { display: none; }
    body.collapsed #expand { display: inline-block; }
  </style>
</head>
<body data-theme="dark">
  <header>
    <span class="status" id="status">等待采集数据…</span>
    <span class="actions">
      <button id="expand" type="button" title="展开列表与小地图">展开</button>
      <button id="collapse" type="button" title="收起成状态条">收起</button>
      <button id="theme" type="button" title="切换明色 / 暗色">明/暗</button>
      <button id="close" type="button" title="关闭小窗">×</button>
    </span>
  </header>
  <main>
    <div class="map-wrap">
      <canvas id="map" width="240" height="240"></canvas>
      <span class="hint" id="map-hint"></span>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>还没收到附近精灵<br />开始采集并进入野外后自动出现</div>
  </main>
  <footer><span id="scene"></span><span id="updated"></span></footer>
  <script src="overlay.js"></script>
</body>
</html>
