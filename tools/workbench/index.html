<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>任务看板 · 工作台</title>
<script>
  /* 主题：默认浅色；用户显式切过深色才用深色（localStorage 记住，首帧之前定好，避免闪白/闪黑） */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('workbench.theme'); } catch (_) { /* 隐私模式读不到就按浅色 */ }
    document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
  })();
</script>
<style>
  /* 设计口径：字号 12/13/14/20，圆角 8/12，间距 4 的倍数；浅色默认，深色可选 */
  :root{
    --fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-16:16px;--fs-20:20px;
    --r-8:8px;--r-12:12px;--pill:999px;
    --p-4:4px;--p-8:8px;--p-12:12px;--p-16:16px;--p-20:20px;--p-24:24px;

    color-scheme:light;
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --surface-2:#F9FAFB;
    --line:#E5E7EB;
    --line-soft:#EEF0F3;
    --line-strong:#D8DCE2;
    --text:#1F2329;
    --text-2:#4B5563;
    --muted:#6B7280;
    --muted-2:#7A8494;
    --primary:#0F9D58;
    --primary-ink:#0B7A44;
    --doing:#D97706;    --doing-ink:#B45309;
    --waiting:#2563EB;  --waiting-ink:#1D4ED8;
    --done:#059669;     --done-ink:#047857;
    --blocked:#DC2626;  --blocked-ink:#B91C1C;
    --backlog:#6B7280;  --backlog-ink:#4B5563;
    --accepted:#7C3AED; --accepted-ink:#6D28D9;
    --bar-opacity:.95;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow:0 4px 14px rgba(16,24,40,.08);
    --top-bg:rgba(247,248,250,.9);
    --control:#FFFFFF;
    --control-2:#F3F4F6;
    --track:#EFF1F4;
    --toast-bg:#FFFFFF;
    --mark-bg:#EAF6EF;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0A0D12;
    --surface:#111823;
    --surface-2:#0D141D;
    --line:#1E2A3A;
    --line-soft:#182333;
    --line-strong:#2A3A50;
    --text:#E6EDF3;
    --text-2:#B8C6D6;
    --muted:#8B98A9;
    --muted-2:#6B7787;
    --primary:#3FB950;
    --primary-ink:#7EE787;
    --doing:#F2B632;    --doing-ink:#F2B632;
    --waiting:#4C9AFF;  --waiting-ink:#8CC0FF;
    --done:#3FB950;     --done-ink:#7EE787;
    --blocked:#F85149;  --blocked-ink:#FFB4AE;
    --backlog:#93A1B1;  --backlog-ink:#B9C4D0;
    --accepted:#A371F7; --accepted-ink:#C9A9FF;
    --bar-opacity:.6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --top-bg:rgba(10,13,18,.86);
    --control:rgba(255,255,255,.03);
    --control-2:rgba(255,255,255,.07);
    --track:rgba(255,255,255,.04);
    --toast-bg:#16202E;
    --mark-bg:rgba(63,185,80,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font:var(--fs-14)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

  /* 状态色：data-col / data-status / data-stage 决定 --accent（色条·圆点）与 --accent-ink（文字） */
  [data-col="doing"],[data-status="doing"],[data-stage="doing"]{--accent:var(--doing);--accent-ink:var(--doing-ink)}
  [data-col="waiting"],[data-status="waiting"],[data-stage="waiting"],[data-stage="delivered"]{--accent:var(--waiting);--accent-ink:var(--waiting-ink)}
  [data-col="done"],[data-status="done"],[data-stage="closed"]{--accent:var(--done);--accent-ink:var(--done-ink)}
  [data-col="backlog"],[data-status="backlog"],[data-stage="backlog"]{--accent:var(--backlog);--accent-ink:var(--backlog-ink)}
  [data-status="blocked"],[data-stage="blocked"]{--accent:var(--blocked);--accent-ink:var(--blocked-ink)}
  [data-stage="accepted"]{--accent:var(--accepted);--accent-ink:var(--accepted-ink)}

  /* ── 顶栏 ── */
  .top{
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid var(--line);
    background:var(--top-bg);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .top-inner{
    max-width:1560px;margin:0 auto;padding:var(--p-12) var(--p-24);
    display:flex;align-items:center;gap:var(--p-16);flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:var(--p-12);min-width:0}
  .mark{
    width:32px;height:32px;flex:none;border-radius:var(--r-8);
    display:grid;place-items:center;font-size:16px;line-height:1;
    color:var(--primary-ink);background:var(--mark-bg);
    border:1px solid color-mix(in srgb,var(--primary) 22%,var(--line));
  }
  .brand h1{margin:0;font-size:var(--fs-20);font-weight:600;letter-spacing:.2px;line-height:1.2}
  .brand p{margin:var(--p-4) 0 0;font-size:var(--fs-12);color:var(--muted);white-space:nowrap}
  .brand p b{color:var(--text-2);font-weight:500}

  .tabs{display:flex;gap:var(--p-4);padding:var(--p-4);border:1px solid var(--line);border-radius:var(--r-12);background:var(--track)}
  .tab{
    appearance:none;border:0;cursor:pointer;border-radius:var(--r-8);
    display:inline-flex;align-items:center;justify-content:center;
    min-height:32px;padding:8px 12px;font:inherit;font-size:var(--fs-13);font-weight:600;
    color:var(--muted);background:transparent;transition:color .15s,background .15s,box-shadow .15s;
  }
  .tab:hover{color:var(--text-2)}
  .tab[aria-selected="true"]{color:var(--text);background:var(--surface);box-shadow:var(--shadow-sm)}
  .tab .n{margin-left:8px;font-size:var(--fs-12);font-weight:500;color:var(--muted-2)}
  .tab[aria-selected="true"] .n{color:var(--primary-ink)}

  .chips{display:flex;align-items:center;gap:var(--p-8);flex-wrap:wrap;margin-left:auto}
  .chip{
    display:inline-flex;align-items:baseline;gap:8px;
    padding:4px 12px;border:1px solid var(--line);border-radius:var(--pill);
    background:var(--control);font-size:var(--fs-12);color:var(--muted);white-space:nowrap;
  }
  .chip b{color:var(--text);font-weight:600;font-size:var(--fs-12)}
  .chip.branch b{color:var(--text-2)}
  .chip.dirty b{color:var(--doing-ink)}
  .chip.dirty.clean b{color:var(--done-ink)}
  .live{
    display:inline-flex;align-items:center;gap:8px;
    min-height:32px;padding:4px 12px;border-radius:var(--pill);border:1px solid var(--line);
    background:var(--control);font-size:var(--fs-12);color:var(--muted);white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--done);box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 45%,transparent);animation:pulse 2.4s infinite}
  .live.is-down .dot{background:var(--blocked);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 40%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

  .theme-toggle{
    appearance:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:32px;padding:4px 12px;border:1px solid var(--line);border-radius:var(--pill);
    background:var(--control);color:var(--text-2);font:inherit;font-size:var(--fs-12);font-weight:500;
    transition:background .15s,border-color .15s,color .15s;
  }
  .theme-toggle:hover{background:var(--control-2);color:var(--text);border-color:var(--line-strong)}
  .theme-toggle .ti{font-size:16px;line-height:1;color:var(--text-2)}

  /* ── 主体 ── */
  .wrap{max-width:1560px;margin:0 auto;padding:var(--p-20) var(--p-24) var(--p-24)}
  .alert{
    display:none;margin:0 0 var(--p-16);padding:12px 16px;border-radius:var(--r-12);
    border:1px solid color-mix(in srgb,var(--blocked) 26%,var(--line));
    background:color-mix(in srgb,var(--blocked) 8%,var(--surface));
    color:var(--blocked-ink);font-size:var(--fs-13);
  }
  .alert.show{display:block}
  [hidden]{display:none !important}

  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--p-16);align-items:start}
  .col{min-width:0;padding:0}
  .col-head{
    display:flex;align-items:center;gap:var(--p-8);
    padding:0 var(--p-4) var(--p-12);margin-bottom:var(--p-12);
    border-bottom:1px solid var(--line);
  }
  .col-head .swatch{width:8px;height:8px;flex:none;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
  .col-head h2{margin:0;font-size:var(--fs-13);font-weight:600;letter-spacing:.2px}
  .col-head .n{
    margin-left:auto;min-width:22px;text-align:center;padding:4px 8px;border-radius:var(--pill);
    font-size:var(--fs-12);font-weight:600;color:var(--accent-ink);
    background:color-mix(in srgb,var(--accent) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);
  }
  .cards{display:flex;flex-direction:column;gap:var(--p-8)}

  .card{
    position:relative;padding:12px 16px;border-radius:var(--r-12);
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column;gap:var(--p-8);
    transition:border-color .18s,transform .18s,box-shadow .18s;
    overflow-wrap:anywhere;cursor:pointer;
  }
  .card::before{
    content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 2px 2px 0;
    background:var(--accent);opacity:var(--bar-opacity);
  }
  .card:hover{border-color:color-mix(in srgb,var(--accent) 34%,var(--line-strong));transform:translateY(-1px);box-shadow:var(--shadow)}
  .card:focus-visible{outline:2px solid color-mix(in srgb,var(--primary) 70%,transparent);outline-offset:2px}
  .card[data-status="blocked"]{border-color:color-mix(in srgb,var(--blocked) 30%,var(--line))}
  .card[data-status="blocked"]::before{background:var(--blocked);opacity:.95}
  .card.is-open{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .card.is-busy{opacity:.7;pointer-events:none}

  .card-top{display:flex;align-items:center;gap:var(--p-8);flex-wrap:wrap}
  .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:var(--fs-12);font-weight:700;letter-spacing:.3px;padding:4px 8px;border-radius:var(--r-8);
    color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);
  }
  .code.muted{color:var(--muted-2);background:var(--control);border-color:var(--line)}
  .badge{
    margin-left:auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
    font-size:var(--fs-12);padding:4px 8px;border-radius:var(--pill);
    color:var(--text-2);border:1px solid var(--line);background:var(--control);
  }
  .badge[data-status]{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 26%,var(--line));background:color-mix(in srgb,var(--accent) 8%,transparent)}

  .title{
    margin:0;font-size:var(--fs-14);font-weight:600;line-height:1.45;letter-spacing:.1px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-12);color:var(--muted)}
  .meta .k{flex:none;color:var(--muted-2)}
  .meta .v{color:var(--text-2);min-width:0}
  .meta .v.rel{color:var(--muted)}
  .blocker{
    display:flex;gap:8px;align-items:flex-start;
    padding:8px;border-radius:var(--r-8);font-size:var(--fs-12);line-height:1.45;
    color:var(--blocked-ink);background:color-mix(in srgb,var(--blocked) 8%,var(--surface));
    border:1px solid color-mix(in srgb,var(--blocked) 24%,var(--line));
  }
  .blocker .tag{flex:none;font-weight:600;color:var(--blocked-ink)}
  .detail{
    margin:0;font-size:var(--fs-13);line-height:1.55;color:var(--text-2);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  /* 展开后完整字段在下面的 kv 里，摘要行就不再重复一遍 */
  .card.is-open .detail,.card.is-open .next{display:none}
  .next{font-size:var(--fs-12);color:var(--muted);display:flex;gap:8px}
  .next .arrow{color:var(--accent);opacity:.9}

  /* ── 审批动作 ── */
  .actions{display:flex;align-items:center;gap:var(--p-8);flex-wrap:wrap;margin-top:var(--p-4)}
  .btn{
    appearance:none;cursor:pointer;font:inherit;font-size:var(--fs-12);font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;
    min-height:32px;padding:4px 12px;border-radius:var(--r-8);line-height:1.4;
    border:1px solid var(--line);background:var(--control);color:var(--text-2);
    transition:background .15s,border-color .15s,color .15s;
  }
  .btn:hover{background:var(--control-2);color:var(--text)}
  .btn.ok{color:var(--done-ink);border-color:color-mix(in srgb,var(--done) 30%,var(--line));background:color-mix(in srgb,var(--done) 8%,var(--surface))}
  .btn.ok:hover{background:color-mix(in srgb,var(--done) 16%,var(--surface))}
  .btn.no{color:var(--blocked-ink);border-color:color-mix(in srgb,var(--blocked) 26%,var(--line));background:color-mix(in srgb,var(--blocked) 7%,var(--surface))}
  .btn.no:hover{background:color-mix(in srgb,var(--blocked) 14%,var(--surface))}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .act-msg{font-size:var(--fs-12);color:var(--muted-2);min-width:0}
  .act-msg[data-kind="done"]{color:var(--done-ink)}
  .act-msg[data-kind="error"]{color:var(--blocked-ink)}
  .act-msg[data-kind="pending"]{color:var(--waiting-ink)}

  /* ── 卡片展开：完整字段 ── */
  .card-more{display:none;border-top:1px dashed var(--line);padding-top:var(--p-12);cursor:default}
  .card.is-open .card-more{display:block}
  .kv{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;margin:0 0 var(--p-12);font-size:var(--fs-12)}
  .kv dt{color:var(--muted-2);font-size:var(--fs-12)}
  .kv dd{margin:0;color:var(--text-2);overflow-wrap:anywhere}
  .kv dd.dim{color:var(--muted-2)}
  .linkbtn{
    appearance:none;border:0;background:transparent;padding:0;cursor:pointer;font:inherit;
    font-size:var(--fs-13);color:var(--waiting-ink);text-decoration:underline;text-underline-offset:2px;
  }
  .linkbtn:hover{color:color-mix(in srgb,var(--waiting) 82%,var(--text))}
  a.linkbtn{text-decoration:underline}
  .note-row{display:block;margin-bottom:var(--p-12)}
  .note-row span{display:block;font-size:var(--fs-12);color:var(--muted-2);margin-bottom:4px}
  .note{
    width:100%;resize:vertical;font:inherit;font-size:var(--fs-12);
    padding:8px 12px;border-radius:var(--r-8);color:var(--text);
    border:1px solid var(--line);background:var(--surface-2);
  }
  .note:focus{outline:none;border-color:color-mix(in srgb,var(--primary) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
  details.raw{font-size:var(--fs-12);color:var(--muted)}
  details.raw summary{cursor:pointer;color:var(--muted-2);user-select:none}
  details.raw summary:hover{color:var(--text-2)}
  table.fields{width:100%;border-collapse:collapse;margin-top:var(--p-8);font-size:var(--fs-12)}
  table.fields th{
    text-align:left;font-weight:500;color:var(--muted-2);white-space:nowrap;
    padding:4px 8px 4px 0;vertical-align:top;width:1%;
  }
  table.fields td{padding:4px 0;color:var(--text-2);overflow-wrap:anywhere}
  table.fields tr+tr th,table.fields tr+tr td{border-top:1px solid var(--line-soft)}

  .empty{
    padding:var(--p-24) var(--p-12);text-align:center;font-size:var(--fs-13);color:var(--muted-2);
    border:1px dashed var(--line);border-radius:var(--r-12);background:var(--control);
  }

  /* ── 会话视图 ── */
  .shead{display:flex;align-items:center;gap:var(--p-12);flex-wrap:wrap;margin:0 0 var(--p-16)}
  .shead h2{margin:0;font-size:var(--fs-14);font-weight:600}
  .shead .hint{font-size:var(--fs-12);color:var(--muted)}
  .stages{display:flex;gap:var(--p-8);flex-wrap:wrap;margin-left:auto}
  .stagebtn{
    appearance:none;cursor:pointer;font:inherit;font-size:var(--fs-12);
    display:inline-flex;align-items:center;gap:8px;min-height:32px;
    padding:4px 12px;border-radius:var(--pill);color:var(--text-2);
    border:1px solid var(--line);background:var(--control);
  }
  .stagebtn b{color:var(--text);font-weight:600}
  .stagebtn[aria-pressed="true"]{
    border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
    background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--text);
  }
  .stagebtn:disabled{opacity:.5;cursor:default}
  .stagebtn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent,var(--muted))}

  .sessions{display:flex;flex-direction:column;gap:var(--p-8)}
  .srow{
    position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto;
    gap:4px 16px;align-items:start;
    padding:12px 16px;border-radius:var(--r-12);
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  }
  .srow::before{
    content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 2px 2px 0;
    background:var(--accent,var(--muted));opacity:var(--bar-opacity);
  }
  .srow .code{
    align-self:start;justify-self:start;text-align:center;
    color:var(--accent-ink,var(--text-2));
    border-color:color-mix(in srgb,var(--accent,var(--line)) 24%,transparent);
    background:color-mix(in srgb,var(--accent,transparent) 10%,transparent);
  }
  .srow-main{min-width:0;display:flex;flex-direction:column;gap:4px}
  .srow-name{font-size:var(--fs-14);font-weight:600;line-height:1.4}
  .srow-name .sid{font-weight:400;font-size:var(--fs-12);color:var(--muted-2);margin-left:8px}
  .srow-meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:var(--fs-12);color:var(--muted)}
  .srow-meta .k{color:var(--muted-2);flex:none}
  .srow-meta .v{color:var(--text-2);flex:1 1 0;min-width:0;overflow-wrap:anywhere}
  .srow-meta .tag{
    font-size:var(--fs-12);padding:0 8px;border-radius:var(--pill);
    border:1px solid var(--line);color:var(--muted-2);
  }
  .srow-stage{justify-self:end;display:flex;align-items:center;gap:8px}
  .stagechip{
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
    font-size:var(--fs-12);font-weight:600;padding:4px 12px;border-radius:var(--pill);
    color:var(--accent-ink,var(--text-2));
    border:1px solid color-mix(in srgb,var(--accent,var(--line)) 26%,transparent);
    background:color-mix(in srgb,var(--accent,transparent) 9%,transparent);
  }
  .stagechip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .srow-tasks{display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--p-4)}
  .taskchip{
    display:inline-flex;align-items:center;gap:4px;max-width:100%;
    font-size:var(--fs-12);padding:4px 8px;border-radius:var(--pill);
    color:var(--muted);border:1px solid var(--line);background:var(--control);
  }
  .taskchip[data-status]{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 26%,var(--line))}
  .srow-outs{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:var(--fs-12);margin-top:var(--p-4)}
  .srow-outs .k{color:var(--muted-2)}
  .srow-outs .linkbtn{font-size:var(--fs-12)}
  .conflict{
    display:flex;gap:8px;align-items:flex-start;
    padding:8px;border-radius:var(--r-8);font-size:var(--fs-12);line-height:1.45;
    color:var(--doing-ink);background:color-mix(in srgb,var(--doing) 8%,var(--surface));
    border:1px solid color-mix(in srgb,var(--doing) 24%,var(--line));
  }
  .conflict .tag{flex:none;font-weight:600;color:var(--doing-ink)}
  .srow .blocker{margin-top:var(--p-4)}
  .srow-block{grid-column:2 / -1}

  /* ── 汇报视图（W4）：左列文件、右侧正文，Markdown 自渲染 ── */
  .reports{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--p-16);align-items:start}
  .rlist{
    display:flex;flex-direction:column;gap:var(--p-4);padding:var(--p-8);
    border:1px solid var(--line);border-radius:var(--r-12);background:var(--surface);box-shadow:var(--shadow-sm);
    position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;
  }
  .rlist-head{
    display:flex;align-items:baseline;gap:var(--p-8);padding:4px var(--p-8) var(--p-8);
    margin-bottom:var(--p-4);border-bottom:1px solid var(--line-soft);
    font-size:var(--fs-12);color:var(--muted-2);
  }
  .rlist-head b{color:var(--text-2);font-weight:600}
  .ritems{display:flex;flex-direction:column;gap:var(--p-4)}
  .ritem{
    appearance:none;text-align:left;font:inherit;cursor:pointer;width:100%;
    display:flex;flex-direction:column;gap:4px;
    padding:var(--p-8) var(--p-12);border:1px solid transparent;border-radius:var(--r-8);
    background:transparent;color:var(--text);transition:background .15s,border-color .15s;
  }
  .ritem:hover{background:var(--control-2)}
  .ritem:focus-visible{outline:2px solid color-mix(in srgb,var(--primary) 70%,transparent);outline-offset:1px}
  .ritem[aria-current="true"]{
    background:color-mix(in srgb,var(--primary) 8%,var(--surface));
    border-color:color-mix(in srgb,var(--primary) 26%,var(--line));
  }
  .ritem .rname{font-size:var(--fs-13);font-weight:600;line-height:1.4;overflow-wrap:anywhere}
  .ritem .rtitle{
    font-size:var(--fs-12);color:var(--muted);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .ritem .rmeta{display:flex;gap:var(--p-8);flex-wrap:wrap;font-size:var(--fs-12);color:var(--muted-2)}

  .rbody{
    min-width:0;padding:var(--p-24);
    border:1px solid var(--line);border-radius:var(--r-12);background:var(--surface);box-shadow:var(--shadow-sm);
  }
  .rhead{
    display:flex;align-items:baseline;gap:var(--p-12);flex-wrap:wrap;
    padding-bottom:var(--p-12);margin-bottom:var(--p-16);border-bottom:1px solid var(--line);
  }
  .rhead h2{margin:0;font-size:var(--fs-14);font-weight:600;overflow-wrap:anywhere}
  .rhead .hint{margin-left:auto;display:flex;gap:var(--p-8);flex-wrap:wrap;font-size:var(--fs-12);color:var(--muted-2)}
  .rhead .hint code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}

  /* Markdown 正文：只给汇报视图用 */
  .md{font-size:var(--fs-14);line-height:1.7;color:var(--text-2);overflow-wrap:anywhere}
  .md>*:first-child{margin-top:0}
  .md>*:last-child{margin-bottom:0}
  .md h1{font-size:var(--fs-20);line-height:1.35;font-weight:600;color:var(--text);margin:0 0 var(--p-16)}
  .md h2{font-size:var(--fs-16);line-height:1.4;font-weight:600;color:var(--text);margin:var(--p-24) 0 var(--p-12);padding-bottom:var(--p-8);border-bottom:1px solid var(--line-soft)}
  .md h3{font-size:var(--fs-14);line-height:1.45;font-weight:600;color:var(--text);margin:var(--p-20) 0 var(--p-8)}
  .md p{margin:0 0 var(--p-12)}
  .md ul,.md ol{margin:0 0 var(--p-12);padding-left:var(--p-24)}
  .md li{margin:var(--p-4) 0}
  .md li>p{margin:0}
  .md blockquote{
    margin:0 0 var(--p-16);padding:var(--p-8) var(--p-12);
    border-left:3px solid color-mix(in srgb,var(--primary) 45%,var(--line));
    border-radius:0 var(--r-8) var(--r-8) 0;
    background:var(--surface-2);color:var(--muted);
  }
  .md blockquote p:last-child{margin-bottom:0}
  .md code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:var(--fs-12);padding:2px 4px;border-radius:4px;
    background:var(--control-2);border:1px solid var(--line-soft);color:var(--text);
  }
  .md pre{
    margin:0 0 var(--p-16);padding:var(--p-12);overflow:auto;
    border:1px solid var(--line);border-radius:var(--r-8);background:var(--surface-2);
  }
  .md pre code{padding:0;border:0;background:none;font-size:var(--fs-12);line-height:1.6;color:var(--text-2);white-space:pre}
  .md-table{margin:0 0 var(--p-16);overflow-x:auto;border-radius:var(--r-8)}
  .md table{width:100%;border-collapse:collapse;font-size:var(--fs-13);background:var(--surface)}
  .md th,.md td{border:1px solid var(--line);padding:var(--p-8) var(--p-12);text-align:left;vertical-align:top}
  .md th{font-size:var(--fs-12);font-weight:600;color:var(--text);background:var(--surface-2);white-space:nowrap}
  .md td{color:var(--text-2)}
  .md a{color:var(--waiting-ink);text-decoration:underline;text-underline-offset:2px}
  .md a:hover{color:color-mix(in srgb,var(--waiting) 80%,var(--text))}
  .md strong{color:var(--text);font-weight:600}
  .md hr{border:0;border-top:1px solid var(--line);margin:var(--p-16) 0}
  .md-raw{
    margin:0;padding:var(--p-12);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;
    font-size:var(--fs-12);line-height:1.6;color:var(--text-2);
    border:1px solid var(--line);border-radius:var(--r-8);background:var(--surface-2);
  }
  details.rawreport{margin-top:var(--p-16);font-size:var(--fs-12);color:var(--muted)}
  details.rawreport summary{cursor:pointer;color:var(--muted-2);user-select:none}
  details.rawreport summary:hover{color:var(--text-2)}
  details.rawreport[open] summary{margin-bottom:var(--p-8)}

  /* ── 底栏 ── */
  .foot{
    max-width:1560px;margin:var(--p-16) auto 0;padding:0;
    display:flex;gap:var(--p-16);flex-wrap:wrap;align-items:center;
    font-size:var(--fs-12);color:var(--muted-2);
  }
  .legend{display:flex;gap:var(--p-12);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
  .legend i{font-style:normal}
  .foot .sep{flex:1}
  .foot code{color:var(--text-2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .foot .appr{display:flex;gap:var(--p-8);align-items:center;flex-wrap:wrap}
  .foot .appr .rec{color:var(--muted)}
  .foot .appr .rec b{color:var(--text-2);font-weight:600}

  .toast{
    position:fixed;left:50%;bottom:var(--p-24);transform:translate(-50%,16px);
    max-width:min(560px,calc(100vw - 28px));
    padding:12px 16px;border-radius:var(--r-12);font-size:var(--fs-13);line-height:1.5;
    background:var(--toast-bg);border:1px solid var(--line);box-shadow:var(--shadow);
    color:var(--text);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast[data-kind="error"]{border-color:color-mix(in srgb,var(--blocked) 42%,var(--line));color:var(--blocked-ink)}
  .toast[data-kind="done"]{border-color:color-mix(in srgb,var(--done) 38%,var(--line));color:var(--done-ink)}

  .flash{animation:flash .6s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 35%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

  @media (max-width:1340px){
    /* 中等宽度：仓库信息条单独一行，顶栏保持「标题 + 视图 + 刷新 + 主题」一行不折 */
    .brand{order:1}
    .tabs{order:2}
    .theme-toggle{order:3}
    .live{order:4}
    .chips{order:5;width:100%;margin-left:0}
  }
  @media (max-width:900px){
    /* 平板窄一点：标题下的数据源说明让位，保证顶栏不折成三行 */
    .brand p{display:none}
  }
  @media (max-width:1180px){
    .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:760px){
    .top-inner{padding:var(--p-12) var(--p-16);gap:var(--p-8)}
    .brand{flex:1 1 auto;min-width:0}
    .brand h1{font-size:var(--fs-20)}
    .live{order:2;padding:4px 12px}
    .theme-toggle{order:3;min-height:40px;min-width:40px;padding:0 12px}
    .theme-toggle .tl{display:none}
    .tabs{order:4;width:100%}
    .tab{flex:1;text-align:center;justify-content:center;min-height:40px;padding:8px}
    /* 仓库信息条在窄屏没有决策价值，让位给内容 */
    .chips{display:none}
    .wrap{padding:var(--p-16) var(--p-16) var(--p-24)}
    .board{grid-template-columns:1fr;gap:var(--p-20)}
    .col-head{position:static;padding-bottom:var(--p-12)}
    .card{padding:12px}
    .card::before{top:12px;bottom:10px}
    .detail{-webkit-line-clamp:4}
    .btn{min-height:40px;padding:8px 16px}
    .stagebtn{min-height:40px;padding:8px 12px}
    .linkbtn{min-height:40px;display:inline-flex;align-items:center}
    .foot{padding:0}
    .alert{margin:0 0 var(--p-12)}
    .shead{margin-bottom:var(--p-12)}
    .shead h2{font-size:var(--fs-14)}
    .stages{margin-left:0;width:100%;gap:8px}
    .srow{grid-template-columns:52px minmax(0,1fr);gap:8px 12px;padding:12px}
    .srow-stage{grid-column:1 / -1;justify-self:start;order:-1}
    .srow-tasks,.srow-outs{grid-column:1 / -1}
    .srow .blocker,.srow .conflict{grid-column:1 / -1}
    .kv{grid-template-columns:56px minmax(0,1fr)}
    .actions{gap:var(--p-8)}
    /* 汇报：列表在上、正文在下，列表限高，正文不用先滚过一整列文件 */
    .reports{grid-template-columns:1fr;gap:var(--p-12)}
    .rlist{position:static;max-height:38vh;padding:var(--p-8)}
    .ritem{min-height:44px;padding:var(--p-8) var(--p-12)}
    .rbody{padding:var(--p-16)}
    .rhead{gap:var(--p-8);margin-bottom:var(--p-12)}
    .rhead .hint{margin-left:0;width:100%}
    .md h2{font-size:var(--fs-16)}
    .md th,.md td{padding:var(--p-8)}
  }
  @media (max-width:560px){
    /* 手机：顶栏压到两行（标题 + 视图切换），其余信息让位给内容 */
    .brand p{display:none}
    .top-inner{padding:var(--p-8) var(--p-16)}
    .tabs{margin-top:var(--p-4)}
    .live{padding:4px 8px}
  }
  @media (max-width:340px){
    /* 极窄（<=320 的老机型）：刷新提示压缩成「圆点 + 省略号」，顶栏仍保持两行 */
    .live{max-width:88px;padding:4px 8px}
    .live #liveText{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  }
</style>
</head>
<body data-view="board">

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark" aria-hidden="true">▦</div>
      <div>
        <h1>任务看板</h1>
        <p>任务 + 会话 + 汇报 · 数据源 <b>docs/任务看板.md</b> / <b>docs/会话台账.md</b> / <b>docs/汇报/</b></p>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="视图">
      <button class="tab" type="button" role="tab" data-view="board" aria-selected="true">任务视图<span class="n" id="tabCountBoard"></span></button>
      <button class="tab" type="button" role="tab" data-view="sessions" aria-selected="false">会话视图<span class="n" id="tabCountSessions"></span></button>
      <button class="tab" type="button" role="tab" data-view="reports" aria-selected="false">汇报<span class="n" id="tabCountReports"></span></button>
    </div>
    <div class="chips" id="chips" aria-label="仓库信息"></div>
    <button class="theme-toggle" id="themeToggle" type="button" title="切换到深色主题" aria-label="切换浅色 / 深色主题">
      <span class="ti" id="themeIcon" aria-hidden="true">☾</span><span class="tl" id="themeLabel">深色</span>
    </button>
    <div class="live" id="live">
      <span class="dot" aria-hidden="true"></span>
      <span id="liveText">5 秒自动刷新</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="alert" id="alert" role="status"></div>

  <section id="view-board" role="tabpanel" aria-label="任务视图">
    <div class="board" id="board" aria-busy="true">
      <div class="empty" style="grid-column:1/-1">正在读取看板…</div>
    </div>
    <div class="foot" id="foot">
      <div class="legend" id="legend"></div>
      <span class="sep"></span>
      <span class="appr" id="appr"></span>
      <span>读取 <code id="readAt">—</code> · 哈希 <code id="sha">—</code> · 每次刷新重读 md，不缓存</span>
    </div>
  </section>

  <section id="view-sessions" role="tabpanel" aria-label="会话视图" hidden>
    <div class="shead">
      <h2>会话</h2>
      <span class="hint" id="sessionHint"></span>
      <div class="stages" id="stages"></div>
    </div>
    <div class="sessions" id="sessions" aria-busy="true">
      <div class="empty">正在读取会话台账…</div>
    </div>
    <div class="foot" id="sessionsFoot">
      <span>台账 <code id="ledgerPath">docs/会话台账.md</code> · 读取 <code id="ledgerReadAt">—</code> · 哈希 <code id="ledgerSha">—</code></span>
    </div>
  </section>
  <section id="view-reports" role="tabpanel" aria-label="汇报视图" hidden>
    <div class="reports">
      <nav class="rlist" id="reportList" aria-label="汇报文件" aria-busy="true">
        <div class="rlist-head"><b>汇报</b><span id="reportDir">docs/汇报/</span></div>
        <div class="ritems" id="reportItems">
          <div class="empty" style="border:0;padding:16px 8px">正在读取目录…</div>
        </div>
      </nav>
      <article class="rbody" id="reportBody" aria-live="polite" aria-busy="true">
        <div class="empty">正在读取汇报…</div>
      </article>
    </div>
    <div class="foot" id="reportsFoot">
      <span>目录 <code id="reportsDirFoot">docs/汇报/</code> · 读取 <code id="reportsReadAt">—</code> · 文件清单按修改时间倒序 · 只读渲染，每次重读不缓存</span>
    </div>
  </section>

</main>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  const REFRESH_MS = 5000;
  const bodyEl = document.body;
  const viewBoardEl = document.getElementById('view-board');
  const viewSessionsEl = document.getElementById('view-sessions');
  const viewReportsEl = document.getElementById('view-reports');
  const boardEl = document.getElementById('board');
  const sessionsEl = document.getElementById('sessions');
  const stagesEl = document.getElementById('stages');
  const sessionHintEl = document.getElementById('sessionHint');
  const reportListEl = document.getElementById('reportList');
  const reportItemsEl = document.getElementById('reportItems');
  const reportBodyEl = document.getElementById('reportBody');
  const reportDirEl = document.getElementById('reportDir');
  const reportsDirFootEl = document.getElementById('reportsDirFoot');
  const reportsReadAtEl = document.getElementById('reportsReadAt');
  const chipsEl = document.getElementById('chips');
  const liveEl = document.getElementById('live');
  const liveText = document.getElementById('liveText');
  const alertEl = document.getElementById('alert');
  const legendEl = document.getElementById('legend');
  const apprEl = document.getElementById('appr');
  const readAtEl = document.getElementById('readAt');
  const shaEl = document.getElementById('sha');
  const toastEl = document.getElementById('toast');
  const tabCountBoard = document.getElementById('tabCountBoard');
  const tabCountSessions = document.getElementById('tabCountSessions');
  const tabCountReports = document.getElementById('tabCountReports');
  const ledgerPathEl = document.getElementById('ledgerPath');
  const ledgerReadAtEl = document.getElementById('ledgerReadAt');
  const ledgerShaEl = document.getElementById('ledgerSha');
  const tabs = [...document.querySelectorAll('.tab')];
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const themeLabel = document.getElementById('themeLabel');
  const THEME_KEY = 'workbench.theme';

  const state = {
    view: 'board',
    board: null,
    sessions: null,
    reports: null,
    fpBoard: null,
    fpSessions: null,
    fpReports: null,
    reportName: null,
    reportTextName: null,
    reportTextMtime: null,
    reportText: null,
    lastReadAt: null,
    open: new Set(),
    notes: new Map(),
    msg: new Map(),
    stageFilter: null,
    taskTotal: 0,
    busy: false,
    renderedOnce: false,
  };

  const SOURCE_LABEL = {
    row: '行内时间',
    doc: '看板更新',
    file: '文件时间',
    'board-row': '看板行内时间',
    'board-doc': '看板更新时间',
    'board-file': '看板文件时间',
    'ledger-snapshot': '台账快照',
    'ledger-file': '台账文件时间',
  };

  const esc = (value) => String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  function rel(ts) {
    if (!ts) return '未知';
    const diff = Date.now() - new Date(ts).getTime();
    if (!Number.isFinite(diff)) return '未知';
    if (diff < 0) return '刚刚';
    const s = Math.floor(diff / 1000);
    if (s < 60) return '刚刚';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' 分钟前';
    const h = Math.floor(m / 60);
    if (h < 24) return h + ' 小时前';
    const d = Math.floor(h / 24);
    return d + ' 天前';
  }

  function exact(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (Number.isNaN(d.getTime())) return '';
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function tickRelative() {
    document.querySelectorAll('[data-ts]').forEach((el) => {
      el.textContent = rel(el.getAttribute('data-ts'));
    });
    if (state.lastReadAt) {
      if (liveEl.classList.contains('is-down')) return;
      const secs = Math.max(0, Math.floor((Date.now() - state.lastReadAt) / 1000));
      liveText.textContent = secs < 3 ? '刚刚刷新 · 5 秒自动' : `${secs} 秒前刷新 · 5 秒自动`;
    }
  }

  function toast(text, kind) {
    toastEl.textContent = text;
    toastEl.setAttribute('data-kind', kind || 'ok');
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 4200);
  }

  function showAlert(text) {
    alertEl.textContent = text;
    alertEl.classList.add('show');
  }
  function hideAlert() {
    alertEl.classList.remove('show');
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) { /* 复制不了就把值留在提示里 */ }
    ta.remove();
  }

  function chip(label, value, cls, title, ts) {
    return `<span class="chip ${cls || ''}"${title ? ` title="${esc(title)}"` : ''}>` +
      `<span>${esc(label)}</span><b class="${cls === 'branch' ? 'mono' : ''}"` +
      `${ts ? ` data-ts="${esc(ts)}"` : ''}>${esc(value)}</b></span>`;
  }

  function renderChips(data, sessionCount) {
    const repo = data.repo || {};
    const dirty = Number(repo.dirtyFiles || 0);
    const total = data.columns
      ? (data.counts && data.counts.total) || 0
      : (data.boardCounts && data.boardCounts.total) || state.taskTotal;
    if (data.columns || data.boardCounts) state.taskTotal = total;
    chipsEl.innerHTML = [
      chip('版本', repo.version ? 'v' + repo.version : '—', 'ver', 'package.json version'),
      chip('分支', repo.branch || '—', 'branch', 'git rev-parse --abbrev-ref HEAD'),
      chip('脏文件', String(dirty), dirty ? 'dirty' : 'dirty clean', 'git status --porcelain 行数'),
      chip('最近提交', rel(repo.lastCommitAt), 'commit', repo.lastCommitAt
        ? exact(repo.lastCommitAt) + (repo.lastCommitSubject ? '\n' + repo.lastCommitSubject : '')
        : '', repo.lastCommitAt),
      chip('任务', String(total || 0), 'total', '任务看板.md 四个表的行数合计'),
    ].join('');
    if (data.columns || data.boardCounts) tabCountBoard.textContent = String(total || 0);
    if (sessionCount != null) tabCountSessions.textContent = String(sessionCount);
  }

  function renderLegend(data) {
    legendEl.innerHTML = (data.legend || []).map((item) =>
      `<span title="${esc(item.meaning)}"><i>${esc(item.symbol)}</i>${esc(item.label)}</span>`
    ).join('');

  function renderApprovals(data) {
    const a = data.approvals || { available: false, total: 0, items: [] };
    const last = a.available && a.items.length ? a.items[a.items.length - 1] : null;
    const text = !a.available
      ? `审批日志 <code>${esc(a.path || 'docs/进度/审批.jsonl')}</code> · 还没有记录`
      : `审批日志 <code>${esc(a.path)}</code> · ${a.total} 条` +

    apprEl.innerHTML = text;

  function srcLabel(src) {
    return SOURCE_LABEL[src] || '';
  }

  function linkHtml(link, labelText) {
    if (!link) return '';
    const text = labelText || link.label || link.raw || '详情';
    if (link.kind === 'url') {
      return `<a class="linkbtn" href="${esc(link.href)}" target="_blank" rel="noreferrer noopener" ` +
        `title="${esc(link.raw)}">${esc(text)} ↗</a>`;
    }
    if (link.kind === 'path') {
      return `<button type="button" class="linkbtn" data-copy="${esc(link.raw)}" ` +
        `title="本地路径，点击复制：${esc(link.raw)}">${esc(text)}</button>`;
    }
    return `<span class="dim">${esc(text)}</span>`;
  }

  /** 「详情」按钮上的字：markdown 给了标签就用标签，否则统称「打开详情」。 */
  function detailLabel(link) {
    if (link && link.label && link.label !== link.raw) return link.label;
    return '打开详情';
  }

  // ── Markdown 渲染（W4，零依赖；只为汇报视图服务）──
  const MD_SEP = /^\s*\|?[\s:|-]+\|?\s*$/;

  function mdSplitRow(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|')) s = s.slice(0, -1);
    return s.split('|').map((c) => c.trim());
  }

  /** 行内：`代码` / **加粗** / [文字](链接)。先整体转义，再按标记替换；代码内容不参与后续解析。 */
  function mdInline(raw) {
    const codes = [];
    let out = esc(raw).replace(/`([^`]+)`/g, (_, code) => {
      codes.push(code);
      return '\u0001' + (codes.length - 1) + '\u0002';
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\[([^\]]*)\]\(([^()\s]+)\)/g, (whole, text, href) => {
      // 只给 http(s)/mailto/站内相对路径开口子；javascript: 之类退化成纯文字
      if (!/^(?:https?:\/\/|mailto:|\/|\.{1,2}\/|#)/i.test(href)) return text;
      return `<a href="${href}" target="_blank" rel="noreferrer noopener">${text}</a>`;
    });
    return out.replace(/\u0001(\d+)\u0002/g, (_, i) => `<code>${codes[Number(i)]}</code>`);
  }

  /** 块级：# ~ ### / 段落 / 列表 / 引用 / ``` 代码块 / | 表格。解析不了就抛错，由调用方退回原文。 */
  function mdToHtml(src) {
    const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    const isStart = (l) => /^\s*(?:#{1,3}\s|>|```|\|)/.test(l) ||
      /^\s*[-*+]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l);
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i += 1; continue; }
      if (/^\s*```/.test(line)) {
        const buf = [];
        i += 1;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1; // 跳过收尾的 ```
        out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
        continue;
      }
      const h = /^\s*(#{1,3})\s+(.*?)\s*$/.exec(line);
      if (h) {
        const n = h[1].length;
        out.push(`<h${n}>${mdInline(h[2])}</h${n}>`);
        i += 1;
        continue;
      }
      if (/^\s*\|/.test(line) && i + 1 < lines.length && MD_SEP.test(lines[i + 1]) && lines[i + 1].includes('-')) {
        const heads = mdSplitRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i]) && !(MD_SEP.test(lines[i]) && lines[i].includes('-'))) {
          rows.push(mdSplitRow(lines[i]));
          i += 1;
        }
        const width = Math.max(heads.length, ...rows.map((r) => r.length), 1);
        const tr = (cells, tag) => '<tr>' + Array.from({ length: width }, (_, k) =>
          `<${tag}>${mdInline(cells[k] || '')}</${tag}>`).join('') + '</tr>';
        out.push('<div class="md-table"><table><thead>' + tr(heads, 'th') + '</thead><tbody>' +
          rows.map((r) => tr(r, 'td')).join('') + '</tbody></table></div>');
        continue;
      }
      if (/^\s*>\s?/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          buf.push(lines[i].replace(/^\s*>\s?/, ''));
          i += 1;
        }
        out.push('<blockquote>' + buf.map((l) => (l.trim() ? `<p>${mdInline(l)}</p>` : '')).join('') + '</blockquote>');
        continue;
      }
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      if (ordered || /^\s*[-*+]\s+/.test(line)) {
        const re = ordered ? /^\s*\d+[.)]\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
        const items = [];
        while (i < lines.length && re.test(lines[i])) {
          // `- [ ] 待办` / `- [x] 已做` 渲染成 ☐ / ☑，别把方括号原样露出来
          const text = re.exec(lines[i])[1].replace(/^\[([ xX])\]\s+/, (_, mark) => (mark.trim() ? '☑ ' : '☐ '));
          items.push(mdInline(text));
          i += 1;
        }
        const tag = ordered ? 'ol' : 'ul';
        out.push(`<${tag}>${items.map((t) => `<li>${t}</li>`).join('')}</${tag}>`);
        continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && !(para.length && isStart(lines[i]))) {
        para.push(lines[i].trim());
        i += 1;
      }
      if (!para.length) { i += 1; continue; } // 兜底：绝不空转
      out.push(`<p>${mdInline(para.join(' '))}</p>`);
    }
    return out.join('\n');
  }

  function sizeText(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  // ── 汇报视图 ──
  function reportItem(file) {
    const active = state.reportName === file.name;
    return `<button type="button" class="ritem" data-report="${esc(file.name)}" ` +
      `aria-current="${active ? 'true' : 'false'}" title="${esc(file.path || file.name)}">` +
      `<span class="rname">${esc(file.title || file.name)}</span>` +
      `<span class="rtitle mono">${esc(file.name)}</span>` +
      `<span class="rmeta">` +
        `<span class="rel" data-ts="${esc(file.mtime || '')}" title="${esc(exact(file.mtime))}">${esc(rel(file.mtime))}</span>` +
        `<span>${esc(sizeText(file.size))}</span>` +
      `</span>` +
      `</button>`;
  }

  function renderReportList(data) {
    const files = data.files || [];
    const dir = data.dir || 'docs/汇报';
    reportDirEl.textContent = dir + '/';
    reportsDirFootEl.textContent = dir + '/';
    reportListEl.setAttribute('aria-busy', 'false');
    reportItemsEl.innerHTML = files.length
      ? files.map(reportItem).join('')
      : `<div class="empty" style="border:0;padding:16px 8px">${esc(data.reason || 'docs/汇报/ 里还没有 .md')}</div>`;
    reportsReadAtEl.textContent = exact(data.generatedAt);
  }

  function renderReportBody(name, text, meta) {
    const size = meta && meta.size != null ? meta.size : new TextEncoder().encode(text || '').length;
    const title = (meta && meta.title) || name.replace(/\.md$/i, '');
    let body;
    let hasH1 = false;
    if (!text || !text.trim()) {
      body = `<div class="empty">这份汇报是空的（0 字节），正文不渲染，也不会白屏。</div>`;
    } else {
      let html = '';
      try {
        html = mdToHtml(text);
      } catch (err) {
        html = '';
      }
      if (html && html.trim()) {
        hasH1 = /<h1[ >]/.test(html);
        body = `<div class="md">${html}</div>`;
      } else {
        body = `<div class="empty">Markdown 没解析出来，下面原样显示原文。</div><pre class="md-raw">${esc(text)}</pre>`;
      }
    }
    reportBodyEl.innerHTML =
      // 正文自己有一级标题就不再重复一遍；没有才把文件名标题顶上来
      `<div class="rhead">${hasH1 ? '' : `<h2>${esc(title)}</h2>`}` +
      `<span class="hint"><code>${esc(name)}</code>` +
      `<span>${esc(exact(meta && meta.mtime))}</span><span>${esc(sizeText(size))}</span></span></div>` +
      body +
      (text && text.trim()
        ? `<details class="rawreport"><summary>看原文（Markdown 源）</summary><pre class="md-raw">${esc(text)}</pre></details>`
        : '');
    reportBodyEl.setAttribute('aria-busy', 'false');
  }

  function card(task) {
    const status = task.statusKey || 'doing';
    const open = state.open.has(task.key);
    const msg = state.msg.get(task.key);
    const msgFresh = msg && Date.now() - msg.at < 120000;
    const note = state.notes.get(task.key) || '';
    const meta = [];
    if (task.assignee) {
      meta.push(`<div class="meta"><span class="k">派给</span><span class="v mono">${esc(task.assignee)}</span></div>`);
    }
    meta.push(
      `<div class="meta"><span class="k">更新</span>` +
      `<span class="v rel" data-ts="${esc(task.updatedAt || '')}" title="${esc(exact(task.updatedAt))}">${esc(rel(task.updatedAt))}</span>` +
      `<span class="k" style="margin-left:auto">${esc(srcLabel(task.updatedSource))}</span></div>`
    );

    const approveOff = status === 'done' ? ' disabled title="已经是 🟢"' : ' title="把这一行改成 🟢 并记一条审批"';
    const rejectOff = status === 'blocked' ? ' disabled title="已经是 🔴"' : ' title="把这一行改成 🔴 并记一条审批"';

    const kv = [
      ['任务', esc(task.title)],
      ['派给', task.assignee ? `<span class="mono">${esc(task.assignee)}</span>` : '<span class="dim">—</span>'],
      ['开始', task.startedAt ? esc(task.startedAt) : '<span class="dim">—</span>'],
      ['最近进展', task.detail ? esc(task.detail) : '<span class="dim">—</span>'],
      ['下一步', task.next ? esc(task.next) : '<span class="dim">—</span>'],
      ['所在列', esc(task.section || '')],
      ['更新时间', `${esc(exact(task.updatedAt))} <span class="dim">（${esc(srcLabel(task.updatedSource))}）</span>`],
    ];
    if (task.detailLink) kv.push(['详情', linkHtml(task.detailLink, detailLabel(task.detailLink))]);

    return `<article class="card${open ? ' is-open' : ''}" data-status="${esc(status)}" data-key="${esc(task.key)}" ` +
      `data-id="${esc(task.id)}" tabindex="0" aria-expanded="${open ? 'true' : 'false'}">` +
      `<div class="card-top">` +
        (task.code ? `<span class="code">${esc(task.code)}</span>` : '') +
        `<span class="badge" data-status="${esc(status)}">${esc(task.status || '')} ${esc(task.statusLabel || '')}</span>` +
      `</div>` +
      `<h3 class="title">${esc(task.title)}</h3>` +
      meta.join('') +
      (task.blocker ? `<div class="blocker"><span class="tag">阻塞</span><span>${esc(task.blocker)}</span></div>` : '') +
      (task.detail ? `<p class="detail">${esc(task.detail)}</p>` : '') +
      (task.next ? `<div class="next"><span class="arrow">→</span><span>${esc(task.next)}</span></div>` : '') +
      `<div class="actions">` +
        `<button type="button" class="btn ok" data-act="approve"${approveOff}>确认已完成</button>` +
        `<button type="button" class="btn no" data-act="reject"${rejectOff}>打回</button>` +
        `<span class="act-msg"${msgFresh ? ` data-kind="${esc(msg.kind)}"` : ''}>${msgFresh ? esc(msg.text) : ''}</span>` +
      `</div>` +
      `<div class="card-more">` +
        `<dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>` +
        `<label class="note-row"><span>打回原因（可选，会写进审批日志）</span>` +
        `<textarea class="note" rows="2" maxlength="200" placeholder="比如：截图对不上 / 还差一项">${esc(note)}</textarea></label>` +
        `<details class="raw"><summary>看板原始字段（${task.cells ? task.cells.length : 0} 列）</summary>` +
        `<table class="fields">${(task.cells || []).map((c) =>
          `<tr><th>${esc(c.header)}</th><td>${esc(c.value) || '<span class="dim">—</span>'}</td></tr>`).join('')}</table>` +
        `</details>` +
      `</div>` +
      `</article>`;
  }

  function renderBoard(data) {
    boardEl.innerHTML = (data.columns || []).map((col) => {
      const cards = col.tasks.length
        ? col.tasks.map(card).join('')
        : '<div class="empty">暂无任务</div>';
      return `<section class="col" data-col="${esc(col.key)}" aria-label="${esc(col.title)}">` +
        `<div class="col-head"><span class="swatch" aria-hidden="true"></span>` +
        `<h2>${esc(col.title)}</h2><span class="n">${col.count}</span></div>` +
        `<div class="cards">${cards}</div></section>`;
    }).join('');
    boardEl.setAttribute('aria-busy', 'false');
  }

  function sessionRow(s) {
    const stage = s.stage || { key: 'backlog', label: '待派', sourceLabel: '台账' };
    const outs = (s.outputs || []).map((o) => linkHtml(o, o.label)).join('');
    return `<article class="srow" data-stage="${esc(stage.key)}" data-key="${esc(s.id)}">` +
      `<div class="code${s.code && s.code !== '—' ? '' : ' muted'}">${esc(s.code && s.code !== '—' ? s.code : '—')}</div>` +
      `<div class="srow-main">` +
        `<div class="srow-name">${esc(s.name || '（台账没写名字）')}` +
          (s.sessionId ? `<span class="sid mono" title="会话 ID 前 8 位">${esc(s.sessionId)}</span>` : '') +
        `</div>` +
        `<div class="srow-meta">` +
          `<span class="k">最后活动</span>` +
          `<span class="v rel" data-ts="${esc(s.updatedAt || '')}" title="${esc(exact(s.updatedAt))}">${esc(rel(s.updatedAt))}</span>` +
          `<span class="tag">${esc(srcLabel(s.updatedSource) || '未知来源')}</span>` +
        `</div>` +
        `<div class="srow-meta">` +
          `<span class="k">台账</span><span class="v">${esc(s.ledgerStatus || '—')}</span>` +
          (s.stageSource === 'board' ? `<span class="tag">阶段按看板判</span>` : '') +
        `</div>` +
        (s.blocker ? `<div class="blocker"><span class="tag">阻塞</span><span>${esc(s.blocker.text)}</span></div>` : '') +
        (s.conflict ? `<div class="conflict"><span class="tag">对不上</span><span>${esc(s.conflict)}</span></div>` : '') +
        (s.tasks && s.tasks.length
          ? `<div class="srow-tasks">${s.tasks.slice(0, 3).map((t) =>
              `<span class="taskchip" data-status="${esc(t.statusKey)}" title="${esc(t.title)}">${esc(t.status)} ${esc(t.title)}</span>`).join('')}` +
            (s.tasks.length > 3 ? `<span class="taskchip">+${s.tasks.length - 3}</span>` : '') +
            `</div>`
          : '') +
        (outs ? `<div class="srow-outs"><span class="k">产出</span>${outs}</div>` : '') +
      `</div>` +
      `<div class="srow-stage"><span class="stagechip" data-stage="${esc(stage.key)}">${esc(stage.label)}</span></div>` +
      `</article>`;
  }

  function renderSessions(data) {
    const list = data.sessions || [];
    const filtered = state.stageFilter ? list.filter((s) => s.stage && s.stage.key === state.stageFilter) : list;
    stagesEl.innerHTML = (data.stages || []).map((stage) => {
      const n = (data.counts && data.counts.byStage && data.counts.byStage[stage.key]) || 0;
      const active = state.stageFilter === stage.key;
      return `<button type="button" class="stagebtn" data-stage="${esc(stage.key)}" aria-pressed="${active ? 'true' : 'false'}"` +
        `${n ? '' : ' disabled'}>${esc(stage.label)} <b>${n}</b></button>`;
    }).join('');
    sessionHintEl.textContent = `现役 ${list.length} 个` +
      (data.counts && data.counts.archived ? ` · 已归档 ${data.counts.archived} 个不在此表` : '') +
      (state.stageFilter ? ` · 只看「${(data.stages || []).find((s) => s.key === state.stageFilter)?.label || state.stageFilter}」` : '');
    sessionsEl.innerHTML = filtered.length
      ? filtered.map(sessionRow).join('')
      : `<div class="empty">${list.length ? '这个阶段没有会话' : '台账里还没有现役会话'}</div>`;
    sessionsEl.setAttribute('aria-busy', 'false');
    if (data.counts) tabCountSessions.textContent = String(data.counts.total || 0);
    if (data.source) {
      ledgerPathEl.textContent = data.source.ledger || 'docs/会话台账.md';
      ledgerReadAtEl.textContent = exact(data.generatedAt);
      ledgerShaEl.textContent = data.source.sha256 ? data.source.sha256.slice(0, 10) : '—';
    }
    tickRelative();
  }

  function fingerprint(data) {
    return JSON.stringify([
      data.source && data.source.sha256,
      data.repo && data.repo.branch,
      data.repo && data.repo.dirtyFiles,
      data.repo && data.repo.lastCommitHash,
      data.repo && data.repo.version,
      data.counts,
      data.columns,
      data.approvals && data.approvals.total,
    ]);
  }

  function flash() {
    boardEl.classList.remove('flash');
    void boardEl.offsetWidth;
    boardEl.classList.add('flash');
  }

  function viewFromHash() {
    const hash = (location.hash || '').replace(/^#/, '');
    return hash === 'sessions' || hash === 'reports' ? hash : 'board';
  }

  function setView(view, opts) {
    const silent = opts && opts.silent;
    state.view = view;
    bodyEl.setAttribute('data-view', view);
    tabs.forEach((tab) => tab.setAttribute('aria-selected', tab.dataset.view === view ? 'true' : 'false'));
    viewBoardEl.hidden = view !== 'board';
    viewSessionsEl.hidden = view !== 'sessions';
    viewReportsEl.hidden = view !== 'reports';
    if (!silent && location.hash !== '#' + view) {
      history.replaceState(null, '', '#' + view);
    }
    if (view === 'sessions') loadSessions(true);
    if (view === 'reports') loadReports(true);
  }

  function firstTaskByKey(key) {
    if (!state.board) return null;
    for (const col of state.board.columns || []) {
      for (const task of col.tasks || []) if (task.key === key) return task;
    }
    return null;
  }

  function firstTaskById(id) {
    if (!state.board) return null;
    for (const col of state.board.columns || []) {
      for (const task of col.tasks || []) if (task.id === id) return task;
    }
    return null;
  }

  async function approve(task, action) {
    if (state.busy || !task) return;
    const key = task.key;
    const noteEl = boardEl.querySelector(`.card[data-key="${key}"] .note`);
    const note = noteEl ? noteEl.value.trim() : '';
    state.busy = true;
    const cardEl = boardEl.querySelector(`.card[data-key="${key}"]`);
    if (cardEl) cardEl.classList.add('is-busy');
    state.msg.set(key, { text: '提交中…', kind: 'pending', at: Date.now() });
    repaintCard(key);
    try {
      const res = await fetch('/api/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: task.id, key: key, action: action, note: note }),
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok || !payload.ok) {
        throw new Error(payload.message || ('HTTP ' + res.status));
      }
      const text = payload.changed
        ? (action === 'approve' ? '已确认 · 看板这一行已改 🟢' : '已打回 · 看板这一行已改 🔴')
        : (payload.note || '状态没变');
      state.msg.set(key, { text: text + (payload.snapshot ? ' · 已备份 ' + payload.snapshot.name : ''), kind: 'done', at: Date.now() });
      state.notes.delete(key);
      toast(text + (payload.snapshot ? '；改前内容已备份到 ' + payload.snapshot.path : ''), 'done');
      await loadBoard(true);
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      state.msg.set(key, { text: '没写进去：' + msg, kind: 'error', at: Date.now() });
      toast('审批没写进去：' + msg, 'error');
      await loadBoard(true);
    } finally {
      state.busy = false;
      const again = boardEl.querySelector(`.card[data-key="${key}"]`);
      if (again) again.classList.remove('is-busy');
    }
  }

  function repaintCard(key) {
    const task = firstTaskByKey(key) || firstTaskById(key);
    if (!task) return;
    const el = boardEl.querySelector(`.card[data-key="${key}"]`);
    if (!el) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = card(task);
    const next = tmp.firstElementChild;
    if (next) el.replaceWith(next);
  }

  function toggleCard(key) {
    if (state.open.has(key)) state.open.delete(key);
    else state.open.add(key);
    const el = boardEl.querySelector(`.card[data-key="${key}"]`);
    if (el) {
      el.classList.toggle('is-open', state.open.has(key));
      el.setAttribute('aria-expanded', state.open.has(key) ? 'true' : 'false');
    }
  }

  async function loadBoard(force) {
    try {
      const res = await fetch('/api/board', { cache: 'no-store' });
      if (!res.ok) {
        let detail = 'HTTP ' + res.status;
        try {
          const body = await res.json();
          if (body && body.message) detail = body.message;
        } catch (_) { /* 非 JSON 错误体 */ }
        throw new Error(detail);
      }
      const data = await res.json();
      const fp = fingerprint(data);
      const changed = force === true || fp !== state.fpBoard;
      state.board = data;
      state.fpBoard = fp;
      state.lastReadAt = Date.now();
      liveEl.classList.remove('is-down');
      hideAlert();
      renderChips(data);
      renderLegend(data);
      renderApprovals(data);
      if (data.source) {
        readAtEl.textContent = exact(data.generatedAt);
        shaEl.textContent = data.source.sha256 ? data.source.sha256.slice(0, 10) : '—';
        readAtEl.title = data.source.path || '';
      }
      if (changed) {
        renderBoard(data);
        if (state.renderedOnce) flash();
        state.renderedOnce = true;
      }
      tickRelative();
    } catch (err) {
      liveEl.classList.add('is-down');
      liveText.textContent = '连不上服务，重试中';
      showAlert('读不到看板数据：' + (err && err.message ? err.message : '未知错误') +
        '。面板只读，恢复服务后 5 秒内自动接上。');
    }
  }

  async function loadSessions(force) {
    try {
      const res = await fetch('/api/sessions', { cache: 'no-store' });
      if (!res.ok) {
        let detail = 'HTTP ' + res.status;
        try {
          const body = await res.json();
          if (body && body.message) detail = body.message;
        } catch (_) { /* 非 JSON 错误体 */ }
        throw new Error(detail);
      }
      const data = await res.json();
      const fp = JSON.stringify([data.source && data.source.sha256, data.counts, data.sessions]);
      const changed = force === true || fp !== state.fpSessions;
      state.sessions = data;
      state.fpSessions = fp;
      state.lastReadAt = Date.now();
      liveEl.classList.remove('is-down');
      hideAlert();
      renderChips(data, data.counts && data.counts.total);
      if (changed) renderSessions(data);
      tickRelative();
    } catch (err) {
      liveEl.classList.add('is-down');
      liveText.textContent = '连不上服务，重试中';
      showAlert('读不到会话台账：' + (err && err.message ? err.message : '未知错误') +
        '。台账路径 docs/会话台账.md，只读解析，不会写任何东西。');
    }
  }

  async function loadReports(force) {
    try {
      const res = await fetch('/api/reports', { cache: 'no-store' });
      if (!res.ok) {
        let detail = 'HTTP ' + res.status;
        try {
          const body = await res.json();
          if (body && body.message) detail = body.message;
        } catch (_) { /* 非 JSON 错误体 */ }
        throw new Error(detail);
      }
      const data = await res.json();
      const files = data.files || [];
      const fp = JSON.stringify(files);
      const changed = force === true || fp !== state.fpReports;
      state.reports = data;
      state.fpReports = fp;
      state.lastReadAt = Date.now();
      liveEl.classList.remove('is-down');
      hideAlert();
      tabCountReports.textContent = files.length ? String(files.length) : '';
      reportsDirFootEl.textContent = (data.dir || 'docs/汇报') + '/';
      reportsReadAtEl.textContent = exact(data.generatedAt);

      if (!files.length) {
        state.reportName = null;
        state.reportText = null;
        state.reportTextName = null;
        renderReportList(data);
        reportBodyEl.setAttribute('aria-busy', 'false');
        reportBodyEl.innerHTML = `<div class="empty">${esc(data.reason || 'docs/汇报/ 里还没有 .md 文件')}` +
          `。把 Markdown 放进去，5 秒内会出现在左边的列表里。</div>`;
        return;
      }
      if (!files.some((f) => f.name === state.reportName)) state.reportName = files[0].name;
      if (changed) renderReportList(data);
      const picked = files.find((f) => f.name === state.reportName) || files[0];
      const stale = state.reportText == null || state.reportTextName !== picked.name ||
        state.reportTextMtime !== picked.mtime;
      if (stale) await loadReportText(picked.name);
      tickRelative();
    } catch (err) {
      liveEl.classList.add('is-down');
      liveText.textContent = '连不上服务，重试中';
      showAlert('读不到汇报目录：' + (err && err.message ? err.message : '未知错误') +
        '。面板只读，恢复服务后 5 秒内自动接上。');
    }
  }

  async function loadReportText(name) {
    const meta = ((state.reports && state.reports.files) || []).find((f) => f.name === name) || null;
    try {
      const res = await fetch('/api/reports/' + encodeURIComponent(name), { cache: 'no-store' });
      if (!res.ok) {
        let detail = 'HTTP ' + res.status;
        try {
          const body = await res.json();
          if (body && body.message) detail = body.message;
        } catch (_) { /* 非 JSON 错误体 */ }
        throw new Error(detail);
      }
      const text = await res.text();
      state.reportText = text;
      state.reportTextName = name;
      state.reportTextMtime = meta ? meta.mtime : null;
      renderReportBody(name, text, meta);
    } catch (err) {
      state.reportText = null;
      state.reportTextName = null;
      reportBodyEl.setAttribute('aria-busy', 'false');
      reportBodyEl.innerHTML = `<div class="rhead"><h2>${esc(name)}</h2></div>` +
        `<div class="empty">读不到这份汇报：${esc(err && err.message ? err.message : String(err))}</div>`;
    }
  }

  function selectReport(name) {
    if (!name) return;
    state.reportName = name;
    if (state.reports) renderReportList(state.reports);
    loadReportText(name);
  }

  function load() {
    if (state.view === 'sessions') return loadSessions();
    if (state.view === 'reports') return loadReports();
    return loadBoard();
  }

  // ── 主题：浅色默认，深色是选项；只记在 localStorage，不落盘、不发给服务端 ──
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function syncThemeUI() {
    const dark = currentTheme() === 'dark';
    themeIcon.textContent = dark ? '☀' : '☾';
    themeLabel.textContent = dark ? '浅色' : '深色';
    themeToggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
    themeToggle.title = dark ? '切换到浅色主题' : '切换到深色主题';
  }
  function setTheme(next) {
    const theme = next === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (_) { /* 存不下就只影响这次 */ }
    syncThemeUI();
    toast(theme === 'dark' ? '已切到深色主题' : '已切到浅色主题', 'done');
  }
  themeToggle.addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
  syncThemeUI();

  // ── 交互 ──
  tabs.forEach((tab) => {
    tab.addEventListener('click', () => setView(tab.dataset.view));
  });

  boardEl.addEventListener('click', (e) => {
    const copyEl = e.target.closest('[data-copy]');
    if (copyEl) {
      e.stopPropagation();
      const value = copyEl.getAttribute('data-copy');
      copyText(value).then(() => toast('已复制：' + value, 'done'));
      return;
    }
    const actEl = e.target.closest('[data-act]');
    if (actEl) {
      e.stopPropagation();
      if (actEl.disabled) return;
      const host = actEl.closest('.card');
      const key = host && host.getAttribute('data-key');
      const task = firstTaskByKey(key);
      if (task) approve(task, actEl.getAttribute('data-act'));
      return;
    }
    if (e.target.closest('a,button,textarea,input,summary,details,label')) return;
    const host = e.target.closest('.card');
    if (host) toggleCard(host.getAttribute('data-key'));
  });

  boardEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.closest('button,a,textarea,input,summary,details')) return;
    const host = e.target.closest('.card');
    if (!host) return;
    e.preventDefault();
    toggleCard(host.getAttribute('data-key'));
  });

  boardEl.addEventListener('input', (e) => {
    const noteEl = e.target.closest('.note');
    if (!noteEl) return;
    const host = noteEl.closest('.card');
    if (host) state.notes.set(host.getAttribute('data-key'), noteEl.value);
  });

  sessionsEl.addEventListener('click', (e) => {
    const copyEl = e.target.closest('[data-copy]');
    if (!copyEl) return;
    const value = copyEl.getAttribute('data-copy');
    copyText(value).then(() => toast('已复制：' + value, 'done'));
  });

  reportItemsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-report]');
    if (btn) selectReport(btn.getAttribute('data-report'));
  });

  stagesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.stagebtn');
    if (!btn || btn.disabled) return;
    const key = btn.getAttribute('data-stage');
    state.stageFilter = state.stageFilter === key ? null : key;
    if (state.sessions) renderSessions(state.sessions);
  });

  const initialView = viewFromHash();
  setView(initialView, { silent: true });
  load();
  setInterval(load, REFRESH_MS);
  setInterval(tickRelative, 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) load();
  });
  window.addEventListener('hashchange', () => {
    const view = viewFromHash();
    if (view !== state.view) setView(view, { silent: true });
  });
})();
</script>
</body>
</html>
